[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rungguard"
version = "0.1.0"
description = "Error Tolerance & Governance — autonomy-rung lifecycle control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-governance", "autonomy", "rung", "agent", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Zero runtime deps — FastAPI / uvicorn are optional server extras
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
aws    = ["boto3>=1.34"]
azure  = ["azure-keyvault-secrets>=4.7", "azure-identity>=1.15"]
gcp    = ["google-cloud-secret-manager>=2.20"]
vault  = ["hvac>=2.1"]
k8s    = ["kubernetes>=29"]
dev    = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",       # FastAPI TestClient transport
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
rungguard = "rungguard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rungguard*"]

[tool.setuptools.package-data]
"rungguard.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
