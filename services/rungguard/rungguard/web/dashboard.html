<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RungGuard — Autonomy Control Plane</title>
<style>
:root {
  --bg:#0b1120; --panel:#131c31; --panel2:#1b2740; --line:#2a3a5c;
  --text:#e6edf7; --muted:#8da2c4; --accent:#2563eb; --green:#16a34a;
  --amber:#d97706; --red:#dc2626; --purple:#7c3aed;
  --r0:#64748b; --r1:#0891b2; --r2:#2563eb; --r3:#7c3aed;
  --r4:#d97706; --r5:#16a34a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;}
header h1{font-size:17px;font-weight:700;}
.tag{color:var(--muted);font-size:12px;}
button{background:var(--accent);color:#fff;border:0;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;}
button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);}
button.danger{background:var(--red);}
button.success{background:var(--green);}
button:hover{filter:brightness(1.12);}
.layout{display:grid;grid-template-columns:220px 1fr 340px;height:calc(100vh - 57px);}
.col{overflow-y:auto;padding:14px;}
.col.left{border-right:1px solid var(--line);background:var(--panel);}
.col.right{border-left:1px solid var(--line);background:var(--panel);}
.nav-item{padding:9px 11px;border-radius:6px;cursor:pointer;margin-bottom:3px;font-size:13px;}
.nav-item:hover,.nav-item.active{background:var(--panel2);}
.nav-item .badge{float:right;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
.card:hover{border-color:var(--accent);}
.card.clickable{cursor:pointer;}
.card h3{font-size:14px;margin-bottom:4px;}
.meta{color:var(--muted);font-size:11px;line-height:1.6;}
.rung-badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--muted);}
.status-active{color:var(--green);}
.status-suspended{color:var(--red);}
.status-pending{color:var(--amber);}
.status-approved{color:var(--green);}
.status-rejected{color:var(--red);}
.status-executed{color:var(--muted);}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0;}
.bar>span{display:block;height:100%;transition:width .3s;}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px;font-size:13px;font-family:inherit;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;text-align:center;}
.stat .num{font-size:26px;font-weight:700;}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.audit-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;}
.audit-row:last-child{border-bottom:0;}
.outcome-allowed{color:var(--green);}
.outcome-denied{color:var(--red);}
.outcome-escalated{color:var(--amber);}
.outcome-rate_limited{color:var(--purple);}
.outcome-approval_required{color:var(--amber);}
.outcome-governance{color:var(--accent);}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:13px;}
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;}
.cred-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;}
.ttl-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px;}
.ttl-bar>span{display:block;height:100%;background:var(--green);}
</style>
</head>
<body>
<header>
  <span style="font-size:20px">🛡️</span>
  <h1>RungGuard</h1>
  <span class="tag">autonomy control plane</span>
  <div style="flex:1"></div>
  <span id="hdr-stats" class="tag"></span>
  <button onclick="showView('register')" class="ghost" style="margin-right:6px">+ Register Agent</button>
  <button onclick="loadAll()">&#8635; Refresh</button>
</header>

<div class="layout">
  <div class="col left">
    <div class="nav-item active" onclick="showView('overview')" id="nav-overview">📊 Overview</div>
    <div class="nav-item" onclick="showView('agents')" id="nav-agents">🤖 Agents</div>
    <div class="nav-item" onclick="showView('approvals')" id="nav-approvals">✅ Approvals <span class="badge" id="pending-count" style="display:none">0</span></div>
    <div class="nav-item" onclick="showView('audit')" id="nav-audit">📋 Audit Log</div>
    <div class="nav-item" onclick="showView('policies')" id="nav-policies">📜 Policies</div>
    <div class="nav-item" onclick="showView('register')" id="nav-register">➕ Register Agent</div>
    <hr style="border:none;border-top:1px solid var(--line);margin:10px 0">
    <div class="section-title">Check Action</div>
    <select id="check-agent-id" style="margin-bottom:6px"></select>
    <input id="check-action" placeholder="e.g. read_customer_data" style="margin-bottom:6px">
    <button onclick="checkAction()" style="width:100%">Check Policy</button>
    <div id="check-result" style="margin-top:8px;font-size:12px;line-height:1.5"></div>
  </div>

  <div class="col" id="main-col"><div class="empty">Loading…</div></div>
  <div class="col right" id="detail-col"><div class="empty">Select an agent to inspect.</div></div>
</div>

<script>
const RUNG_COLORS=['#64748b','#0891b2','#2563eb','#7c3aed','#d97706','#16a34a'];
const RUNG_NAMES=['Manual','Assisted','Recommended','Supervised','Conditional','Autonomous'];
let state={view:'overview',agents:[],requests:[],audit:[],policies:[],selectedAgent:null};

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||r.statusText);}
  return r.json();
}

async function loadAll(){
  const [sum,agents,reqs,aud,pols]=await Promise.all([
    api('/api/summary'),api('/api/agents'),
    api('/api/change-requests'),api('/api/audit?limit=200'),
    api('/api/policies'),
  ]);
  state.agents=agents.agents||[];
  state.requests=reqs.requests||[];
  state.audit=aud.entries||[];
  state.policies=pols.policies||[];
  const pending=state.requests.filter(r=>r.status==='pending');
  const pc=document.getElementById('pending-count');
  pc.textContent=pending.length;
  pc.style.display=pending.length?'':'none';
  const d=sum.agents||{};
  document.getElementById('hdr-stats').textContent=
    `${d.total||0} agents · ${pending.length} pending · ${(sum.audit||{}).total_entries||0} audit entries`;
  populateAgentSelect();
  render();
}

function populateAgentSelect(){
  const sel=document.getElementById('check-agent-id');
  const prev=sel.value;
  sel.innerHTML='<option value="">— select agent —</option>'+
    state.agents.map(a=>`<option value="${a.id}" ${a.id===prev?'selected':''}>${a.name}</option>`).join('');
}

function rungBadge(rung){
  const c=RUNG_COLORS[rung]||'#888';
  return `<span class="rung-badge" style="background:${c}">Rung ${rung}: ${RUNG_NAMES[rung]||rung}</span>`;
}

function showView(v){
  state.view=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+v);
  if(el)el.classList.add('active');
  render();
}

function render(){
  const m=document.getElementById('main-col');
  if(state.view==='overview') renderOverview(m);
  else if(state.view==='agents') renderAgents(m);
  else if(state.view==='approvals') renderApprovals(m);
  else if(state.view==='audit') renderAudit(m);
  else if(state.view==='policies') renderPolicies(m);
  else if(state.view==='register') renderRegister(m);
}

function renderOverview(el){
  const sum_agents=state.agents.reduce((a,ag)=>({
    total:a.total+1,
    active:a.active+(ag.status==='active'?1:0),
    suspended:a.suspended+(ag.status==='suspended'?1:0),
  }),{total:0,active:0,suspended:0});
  const pending=state.requests.filter(r=>r.status==='pending').length;
  const denied=state.audit.filter(e=>e.outcome==='denied').length;
  const rungDist={};
  state.agents.forEach(a=>{rungDist[a.current_rung]=(rungDist[a.current_rung]||0)+1;});
  el.innerHTML=`
    <div class="section-title">Control Plane Overview</div>
    <div class="grid4">
      <div class="stat"><div class="num">${sum_agents.total}</div><div class="lbl">Agents</div></div>
      <div class="stat"><div class="num" style="color:var(--amber)">${pending}</div><div class="lbl">Pending Approvals</div></div>
      <div class="stat"><div class="num" style="color:var(--red)">${sum_agents.suspended}</div><div class="lbl">Suspended</div></div>
      <div class="stat"><div class="num" style="color:var(--red)">${denied}</div><div class="lbl">Denied Actions</div></div>
    </div>
    <div class="section-title">Rung Distribution</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    ${[0,1,2,3,4,5].map(r=>`
      <div style="text-align:center;min-width:70px;">
        <div style="background:${RUNG_COLORS[r]};height:${Math.max(8,(rungDist[r]||0)*20)}px;border-radius:4px;transition:height .3s"></div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">R${r}<br>${rungDist[r]||0}</div>
      </div>`).join('')}
    </div>
    <div class="section-title">Recent Audit Events</div>
    ${state.audit.slice(-20).reverse().map(e=>auditRow(e)).join('')||'<div class="empty">No events yet.</div>'}
  `;
}

function renderAgents(el){
  if(!state.agents.length){el.innerHTML='<div class="empty">No agents registered.</div>';return;}
  el.innerHTML='<div class="section-title">Registered Agents</div>'+
    state.agents.map(a=>`
      <div class="card clickable" onclick="selectAgent('${a.id}')">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <h3>${a.name}</h3>
          ${rungBadge(a.current_rung)}
        </div>
        <div class="meta">
          Owner: ${a.owner} &nbsp;&middot;&nbsp;
          Status: <span class="status-${a.status}">${a.status}</span><br>
          ${a.description||''}
        </div>
        <div class="row" style="margin-top:8px;gap:6px">
          <button class="ghost" style="font-size:11px;padding:4px 9px" onclick="event.stopPropagation();openPromotion('${a.id}')">Promote &uarr;</button>
          <button class="ghost danger" style="font-size:11px;padding:4px 9px" onclick="event.stopPropagation();openDemotion('${a.id}')">Demote &darr;</button>
        </div>
      </div>`).join('');
}

function renderApprovals(el){
  const pending=state.requests.filter(r=>r.status==='pending');
  if(!pending.length){el.innerHTML='<div class="empty">No pending approvals.</div>';return;}
  el.innerHTML='<div class="section-title">Pending Approval Requests</div>'+
    pending.map(r=>`
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <span style="font-weight:700">${r.direction.toUpperCase()}</span>
          <span>${rungBadge(r.from_rung)} &rarr; ${rungBadge(r.to_rung)}</span>
        </div>
        <div class="meta">
          Agent: <b>${agentName(r.agent_id)}</b><br>
          Requested by: ${r.requested_by}<br>
          Justification: ${r.justification}<br>
          Expires: ${r.expires_at?new Date(r.expires_at).toLocaleString():'never'}
        </div>
        <div class="section-title">Approval Steps</div>
        ${r.approval_steps.map(s=>`
          <div class="row" style="margin-bottom:8px;align-items:flex-start">
            <div style="flex:1">
              <b>${s.approver_role}</b>
              <span class="status-${s.decision}" style="margin-left:8px">${s.decision}</span>
              ${s.notes?`<div class="meta">${s.notes}</div>`:''}
            </div>
            ${s.decision==='pending'?`
              <button class="success" style="font-size:11px;padding:4px 9px"
                onclick="doApprove('${r.id}','${s.approver_role}')">Approve</button>
              <button class="danger" style="font-size:11px;padding:4px 9px"
                onclick="doReject('${r.id}','${s.approver_role}')">Reject</button>
            `:''}
          </div>`).join('')}
      </div>`).join('');
}

function renderAudit(el){
  const entries=[...state.audit].reverse();
  el.innerHTML=`<div class="section-title">Audit Log (${entries.length} entries)</div>
    <div style="margin-bottom:10px">
      <button class="ghost" style="font-size:11px;padding:4px 9px"
        onclick="window.open('/api/audit/export','_blank')">Export JSONL &darr;</button>
    </div>`+
    (entries.length?entries.map(e=>auditRow(e,true)).join(''):
      '<div class="empty">No audit entries yet.</div>');
}

function auditRow(e,verbose=false){
  const cat=e.action_category||'';
  const cls=cat==='governance'?'outcome-governance':`outcome-${e.outcome||''}`;
  return `<div class="audit-row">
    <span class="${cls}" style="font-weight:700">${(e.outcome||'').toUpperCase()}</span>
    <span style="color:var(--muted);margin:0 6px">${rungChip(e.rung_at_time)}</span>
    <span>${e.action||''}</span>
    ${verbose?`<div class="meta" style="margin-top:2px">Agent: ${agentName(e.agent_id)} &nbsp;&middot;&nbsp; ${fmtTime(e.timestamp)}</div>`:''}
  </div>`;
}

function renderPolicies(el){
  el.innerHTML='<div class="section-title">Blast-Radius Policies per Rung</div>'+
    state.policies.map(p=>`
      <div class="card" style="margin-bottom:10px">
        <div class="row" style="margin-bottom:6px">${rungBadge(p.rung)}</div>
        <div class="meta" style="margin-bottom:8px">${p.description}</div>
        <div class="row" style="flex-wrap:wrap;gap:4px;margin-bottom:6px">
          ${(p.allowed_actions||[]).map(a=>`<span class="pill" style="color:var(--green)">&check; ${a}</span>`).join('')}
          ${(p.denied_actions||[]).map(a=>`<span class="pill" style="color:var(--red)">&cross; ${a}</span>`).join('')}
          ${(p.require_approval_actions||[]).map(a=>`<span class="pill" style="color:var(--amber)">&#9888; ${a}</span>`).join('')}
        </div>
        <div class="meta">
          ${p.max_financial_amount!=null?`Max financial: $${p.max_financial_amount.toLocaleString()} &nbsp;&middot;&nbsp; `:''}
          ${p.credential_ttl_seconds?`Cred TTL: ${p.credential_ttl_seconds}s`:'No credentials'}
          ${p.rollback_window_seconds?` &nbsp;&middot;&nbsp; Rollback: ${p.rollback_window_seconds}s`:''}
        </div>
      </div>`).join('');
}

function renderRegister(el){
  el.innerHTML=`
    <div class="section-title">Register New Agent</div>
    <div class="card">
      <label>Agent name</label><input id="reg-name" placeholder="e.g. refund-automation-agent">
      <label>Owner (team/person)</label><input id="reg-owner" placeholder="e.g. Finance Ops">
      <label>Owner email</label><input id="reg-email" type="email">
      <label>Description</label><textarea id="reg-desc" rows="2"></textarea>
      <label>Initial rung</label>
      <select id="reg-rung">
        ${RUNG_NAMES.map((n,i)=>`<option value="${i}" ${i===0?'selected':''}>Rung ${i}: ${n}</option>`).join('')}
      </select>
      <div style="margin-top:12px">
        <button onclick="doRegister()">Register Agent</button>
      </div>
      <div id="reg-result" style="margin-top:10px;font-size:12px"></div>
    </div>`;
}

async function doRegister(){
  const name=v('reg-name'),owner=v('reg-owner');
  if(!name||!owner){alert('Name and owner are required.');return;}
  try{
    const agent=await api('/api/agents',{method:'POST',body:JSON.stringify({
      name,owner,owner_email:v('reg-email'),description:v('reg-desc'),
      initial_rung:+v('reg-rung'),
    })});
    document.getElementById('reg-result').innerHTML=
      `<span style="color:var(--green)">&check; Registered: ${agent.id}</span>`;
    await loadAll();
  }catch(e){document.getElementById('reg-result').innerHTML=
    `<span style="color:var(--red)">Error: ${e.message}</span>`;}
}

async function selectAgent(id){
  state.selectedAgent=id;
  const [agent,creds,hist]=await Promise.all([
    api(`/api/agents/${id}`),
    api(`/api/agents/${id}/credentials`),
    api(`/api/agents/${id}/history`),
  ]);
  const el=document.getElementById('detail-col');
  const active=creds.active||[];
  const assignments=hist.assignments||[];
  el.innerHTML=`
    <h2 style="margin-bottom:4px">${agent.name}</h2>
    <div class="meta" style="margin-bottom:10px">${agent.description||'No description.'}</div>
    <div class="row" style="margin-bottom:10px">
      ${rungBadge(agent.current_rung)}
      <span class="pill status-${agent.status}">${agent.status}</span>
    </div>
    <div class="meta">Owner: ${agent.owner} &nbsp; ${agent.owner_email||''}</div>
    <div class="section-title">Active Credentials (${active.length})</div>
    ${active.length?active.map(c=>{
      const issued=new Date(c.issued_at);
      const exp=c.expires_at?new Date(c.expires_at):null;
      const remaining=exp?Math.max(0,(exp-Date.now())/1000):null;
      const total=exp?(exp-issued)/1000:null;
      const pct=total&&remaining?Math.round(remaining/total*100):null;
      return `<div class="cred-row">
        <div>
          <span style="font-weight:700">${c.credential_type}</span>
          <span class="pill" style="margin-left:4px">${c.provider}</span><br>
          <span class="meta">${c.secret_ref.substring(0,32)}&hellip;</span>
          ${exp?`<div class="ttl-bar"><span style="width:${pct}%;background:${pct>50?'var(--green)':pct>20?'var(--amber)':'var(--red)'}"></span></div>
          <span class="meta">Expires in ${remaining?Math.round(remaining/60)+'m':'-'}</span>`:''}
        </div>
        <span class="pill" style="color:var(--green)">${c.status}</span>
      </div>`;}).join(''):'
      <div class="meta">No active credentials.</div>'}
    <div class="section-title">Assignment History (${assignments.length})</div>
    ${assignments.slice().reverse().map((a,i)=>`
      <div class="meta" style="padding:4px 0;border-bottom:1px solid var(--line)">
        ${rungChip(a.rung)} &nbsp; granted by ${a.granted_by}
        &nbsp;&middot;&nbsp; ${fmtTime(a.granted_at)}
        ${a.revoked_at?` &nbsp;<span style="color:var(--red)">revoked ${fmtTime(a.revoked_at)}</span>`:''}
      </div>`).join('')||'<div class="meta">None.</div>'}
    <div class="section-title">Actions</div>
    <div class="row">
      <button class="ghost" onclick="openPromotion('${agent.id}')">Promote &uarr;</button>
      <button class="ghost danger" onclick="openDemotion('${agent.id}')">Demote &darr;</button>
      <button class="ghost danger" onclick="suspend('${agent.id}')">Suspend &ominus;</button>
    </div>
  `;
}

async function openPromotion(id){
  const agent=state.agents.find(a=>a.id===id);
  if(!agent)return;
  const to=prompt(`Promote "${agent.name}" to rung (current: ${agent.current_rung}):`,agent.current_rung+1);
  if(!to)return;
  const why=prompt('Justification:','Sufficient evidence accumulated.');
  if(!why)return;
  const by=prompt('Your name:','team.lead');
  if(!by)return;
  try{
    const req=await api(`/api/agents/${id}/change-requests`,{method:'POST',body:JSON.stringify({
      to_rung:+to,requested_by:by,justification:why,direction:'promotion'
    })});
    alert(`Request ${req.id} submitted. Status: ${req.status}`);
    await loadAll();showView('approvals');
  }catch(e){alert('Error: '+e.message);}
}

async function openDemotion(id){
  const agent=state.agents.find(a=>a.id===id);
  if(!agent)return;
  const to=prompt(`Demote "${agent.name}" to rung (current: ${agent.current_rung}):`,Math.max(0,agent.current_rung-1));
  if(!to)return;
  const why=prompt('Reason for demotion:','Policy violation detected.');
  if(!why)return;
  const by=prompt('Your name:','ai.governance.officer');
  if(!by)return;
  try{
    const req=await api(`/api/agents/${id}/change-requests`,{method:'POST',body:JSON.stringify({
      to_rung:+to,requested_by:by,justification:why,direction:'demotion'
    })});
    alert(`Demotion request ${req.id}: ${req.status}`);
    await loadAll();
  }catch(e){alert('Error: '+e.message);}
}

async function suspend(id){
  const agent=state.agents.find(a=>a.id===id);
  if(!agent)return;
  if(!confirm(`Suspend "${agent.name}" and revoke all credentials?`))return;
  const why=prompt('Reason:','Emergency suspension.');
  if(!why)return;
  try{
    const req=await api(`/api/agents/${id}/change-requests`,{method:'POST',body:JSON.stringify({
      to_rung:0,requested_by:'ciso',justification:why,direction:'suspension'
    })});
    alert(`Agent suspended. Request ${req.id}: ${req.status}`);
    await loadAll();
  }catch(e){alert('Error: '+e.message);}
}

async function doApprove(reqId,role){
  const name=prompt(`Approve as ${role} &mdash; your name:`,role);
  if(!name)return;
  const notes=prompt('Notes (optional):','');
  try{
    const r=await api(`/api/change-requests/${reqId}/approve`,{method:'POST',
      body:JSON.stringify({approver:name,approver_role:role,notes:notes||''})});
    alert(`Approved. Request status: ${r.status}`);
    await loadAll();showView('approvals');
  }catch(e){alert('Error: '+e.message);}
}

async function doReject(reqId,role){
  const name=prompt(`Reject as ${role} &mdash; your name:`,role);
  if(!name)return;
  const reason=prompt('Reason for rejection:','Insufficient evidence.');
  try{
    const r=await api(`/api/change-requests/${reqId}/reject`,{method:'POST',
      body:JSON.stringify({approver:name,approver_role:role,notes:reason||''})});
    alert(`Rejected. Request status: ${r.status}`);
    await loadAll();showView('approvals');
  }catch(e){alert('Error: '+e.message);}
}

async function checkAction(){
  const id=document.getElementById('check-agent-id').value;
  const action=document.getElementById('check-action').value.trim();
  if(!id||!action){document.getElementById('check-result').textContent='Select agent + enter action.';return;}
  try{
    const r=await api(`/api/agents/${id}/check`,{method:'POST',
      body:JSON.stringify({action})});
    const c=r.outcome==='allow'?'var(--green)':r.outcome==='deny'?'var(--red)':'var(--amber)';
    document.getElementById('check-result').innerHTML=
      `<span style="color:${c};font-weight:700">${r.outcome.toUpperCase()}</span><br>
       Rung ${r.rung} &middot; ${r.action_category}<br>
       <span style="color:var(--muted)">${r.reason}</span>`;
  }catch(e){document.getElementById('check-result').textContent='Error: '+e.message;}
}

function rungChip(r){
  const c=RUNG_COLORS[r]||'#888';
  return `<span style="background:${c};color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700">R${r}</span>`;
}
function agentName(id){return (state.agents.find(a=>a.id===id)||{}).name||id.substring(0,10)+'…';}
function fmtTime(ts){if(!ts)return '-';const d=new Date(ts);return d.toLocaleTimeString()+' '+d.toLocaleDateString();}
const v=id=>document.getElementById(id)?.value||'';

loadAll();
setInterval(loadAll,30000);
</script>
